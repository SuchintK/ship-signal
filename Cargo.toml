[package]
name = "ship-signal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
postgres-native-tls = "0.5"
native-tls = "0.2"

rusqlite = { version = "0.38", features = ["bundled", "chrono"] }
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rig-core = { version = "0.46", features = ["reqwest"] }
rig-agent = "0.46"

schemars = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls", "chrono"] }

[dev-dependencies]
tempfile = "3"
